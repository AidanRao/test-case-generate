services:
  test-case-generate:
    build: .
    image: test-case-generate
    container_name: test-case-generate
    ports:
      - "8005:80"
    volumes:
      - ./backend/data:/app/data
    environment:
      - UNIPORTAL_SYNC_ENABLED=false
      - DATA_DIR=/app/data
      - TESTCASE_REQUIREMENT_WORKERS=${TESTCASE_REQUIREMENT_WORKERS:-2}
    restart: unless-stopped
