services:
  test-case-generate:
    build: .
    image: test-case-generate
    container_name: test-case-generate
    ports:
      - "8005:80"
    volumes:
      # UniPortal uploads are read only; manifests and requirements are read here.
      - uniportal_storage:/data/uniportal
      # Keep using the existing local store for projects and generated test cases.
      - ./backend/data:/app/data
      - ./backend/config.json:/app/config.json:ro
    environment:
      - UNIPORTAL_STORAGE_PATH=/data/uniportal
      - UNIPORTAL_SYNC_INTERVAL_SECONDS=10
      - DATA_DIR=/app/data
      - TESTCASE_REQUIREMENT_WORKERS=${TESTCASE_REQUIREMENT_WORKERS:-2}
    restart: unless-stopped

volumes:
  uniportal_storage:
    external: true
    name: ${UNIPORTAL_VOLUME_NAME:-uniportal_storage}
